# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Pradeep Singh"
title_separator          : "-"
name                     : &name "Pradeep Singh"
description              : &description "Pradeep Singh's academic portfolio"
url                      : "https://pradeepsinghnitk.github.io"
baseurl                  : ""
repository               : "pradeepsinghnitk/pradeepsinghnitk.github.io"

# Site Author
author:
  avatar           : "profile.png"
  name             : "Pradeep Singh"
  bio              : "PostDoc/Engineer at INRIA Center, Université Côte d’Azur. Working on small foundation models for biology data, representation learning, and practical AI systems."
  location         : "Nice, France"
  employer         : "INRIA Center, Université Côte d'Azur"
  uri              : "https://pradeepsinghnitk.github.io"
  email            : "pradeep.singh@inria.fr"

  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=VmelJF8AAAAJ"
  orcid            : "https://orcid.org/0000-0002-1215-7553"
  semantic         :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  github           : "pradeepsinghnitk"
  linkedin         : "pradeep-singh-1a0335119"

  twitter          :
  facebook         :
  instagram        :
  youtube          :
  medium           :
  mastodon         :
  bluesky          :

publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : false
  path                   :

social:
  type                   : "Person"
  name                   : "Pradeep Singh"
  links:
    - "https://github.com/pradeepsinghnitk"
    - "https://www.linkedin.com/in/pradeep-singh-1a0335119/"
    - "https://scholar.google.com/citations?user=VmelJF8AAAAJ"
    - "https://orcid.org/0000-0002-1215-7553"
    - "https://tavlab.iiitd.edu.in/team/pradeep-singh"

analytics:
  provider               : "false"
  google:
    tracking_id          :

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Paris

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
